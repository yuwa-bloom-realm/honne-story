<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>大丈夫の奥へ — 本音を見つける静かな旅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0c0916;
  --cream:     #f0eade;
  --cream-dim: rgba(240,234,222,0.75);
  --gold:      #c9a84c;
  --gold-lt:   #e8d5a3;
  --gold-dim:  rgba(201,168,76,0.35);
  --purple:    #2d1b4e;
  --purple-md: #4a2d7a;
  --purple-lt: rgba(107,77,138,0.35);
  --mist:      #d8d0ee;
  --font-body: 'Noto Serif JP', serif;
  --font-title:'Shippori Mincho', serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size: 17px; }

body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ── 星空 ── */
#stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  overflow: hidden;
}
.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--d) var(--delay) infinite alternate ease-in-out;
}
@keyframes twinkle {
  from { opacity: 0.08; transform: scale(1); }
  to   { opacity: 0.7;  transform: scale(1.6); }
}

/* ── レイアウト ── */
#app {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto;
  min-height: 100vh;
  display: flex; flex-direction: column;
  padding: 0 0 env(safe-area-inset-bottom, 16px);
}

/* ── シーン画像 ── */
.scene-image {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  display: block;
  opacity: 0.88;
}
.scene-image-placeholder {
  width: 100%; height: 180px;
  background: linear-gradient(160deg, #1a0e2e 0%, #0c0916 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 52px;
  opacity: 0.7;
}

/* ── ストーリーエリア ── */
#story-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 18px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* ── ナレーション ── */
.narration {
  text-align: center;
  font-size: 1.05rem;
  line-height: 2.2;
  color: rgba(240,234,222,0.88);
  margin: 20px auto;
  max-width: 88%;
  letter-spacing: 0.06em;
  animation: fadeSlide 0.55s ease both;
  font-family: var(--font-title);
}
.narration.keyword {
  color: var(--gold-lt);
  font-family: var(--font-title);
  font-size: 1.15rem;
  padding: 18px 20px;
  text-align: center;
  margin: 20px auto;
  max-width: 88%;
  line-height: 2.0;
  border-top: 1px solid var(--gold-dim);
  border-bottom: 1px solid var(--gold-dim);
}

/* ── 吹き出し共通 ── */
.bubble-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin: 10px 0;
  animation: fadeSlide 0.5s ease both;
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  border: 1.5px solid var(--gold-dim);
  display: flex; align-items: center; justify-content: center;
  background: var(--purple);
  font-size: 22px;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.bubble {
  max-width: 78%;
  padding: 13px 16px;
  border-radius: 18px;
  font-size: 0.92rem;
  line-height: 1.85;
  position: relative;
}

/* 左（ミーア・動物） */
.bubble-left .bubble {
  background: linear-gradient(135deg, rgba(74,45,122,0.75), rgba(45,27,78,0.9));
  border: 1px solid var(--gold-dim);
  border-bottom-left-radius: 4px;
  color: var(--cream);
}
.bubble-left { flex-direction: row; }
.bubble-left .bubble::before {
  content: '';
  position: absolute; left: -7px; bottom: 10px;
  border: 7px solid transparent;
  border-right-color: rgba(74,45,122,0.85);
  border-left: 0;
}

/* 右（name） */
.bubble-right { flex-direction: row-reverse; }
.bubble-right .bubble {
  background: rgba(240,234,222,0.1);
  border: 1px solid rgba(240,234,222,0.2);
  border-bottom-right-radius: 4px;
  color: var(--cream-dim);
  font-style: italic;
}
.bubble-right .bubble::before {
  content: '';
  position: absolute; right: -7px; bottom: 10px;
  border: 7px solid transparent;
  border-left-color: rgba(240,234,222,0.12);
  border-right: 0;
}

.speaker-name {
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  color: var(--gold);
  opacity: 0.75;
  margin-bottom: 4px;
  display: block;
}

/* 動物の小さい吹き出し */
.bubble-animal .bubble {
  font-size: 0.85rem;
  padding: 10px 14px;
  background: linear-gradient(135deg, rgba(45,27,78,0.6), rgba(20,12,38,0.8));
}
.bubble-animal .avatar { width: 36px; height: 36px; font-size: 18px; }

/* ── 選択肢 ── */
#choices-area {
  padding: 10px 18px 0;
  display: flex; flex-direction: column; gap: 8px;
}
.choice-btn {
  background: transparent;
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  padding: 14px 18px;
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 0.9rem;
  line-height: 1.6;
  text-align: left;
  cursor: pointer;
  transition: all 0.25s;
}
.choice-btn:hover, .choice-btn:active {
  border-color: var(--gold);
  background: rgba(201,168,76,0.1);
  color: var(--gold-lt);
  transform: translateX(4px);
}
.choice-tag {
  display: inline-block;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--gold);
  opacity: 0.65;
  margin-right: 6px;
}

/* ── ナビバー ── */
#nav-bar {
  position: sticky; bottom: 0;
  background: linear-gradient(to top, rgba(12,9,22,0.98) 60%, transparent);
  padding: 12px 18px 20px;
  display: flex; gap: 10px; align-items: center;
}
.btn-back {
  background: transparent;
  border: 1px solid rgba(240,234,222,0.2);
  border-radius: 10px;
  padding: 12px 16px;
  color: var(--cream-dim);
  font-family: var(--font-body);
  font-size: 0.82rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-back:hover { border-color: var(--gold-dim); color: var(--gold-lt); }
.btn-back:disabled { opacity: 0.3; cursor: default; }

.btn-next {
  flex: 1;
  background: linear-gradient(135deg, #c9a84c, #e8d5a3);
  border: none;
  border-radius: 10px;
  padding: 14px 20px;
  color: #1a1520;
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: all 0.25s;
  box-shadow: 0 4px 20px rgba(201,168,76,0.3);
}
.btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(201,168,76,0.48); }
.btn-next:active { transform: translateY(0); }

/* ── 名前入力 ── */
#name-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 28px;
  text-align: center;
}
.title-ornament { color: var(--gold); font-size: 14px; letter-spacing: 10px; opacity: 0.5; margin-bottom: 24px; }
.title-lantern { font-size: 52px; margin-bottom: 16px; animation: glow 3s ease-in-out infinite alternate; }
@keyframes glow {
  from { filter: drop-shadow(0 0 8px rgba(201,168,76,0.4)); }
  to   { filter: drop-shadow(0 0 24px rgba(201,168,76,0.9)); }
}
.app-title {
  font-family: var(--font-title);
  font-size: 2rem;
  color: var(--gold-lt);
  margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(201,168,76,0.3);
}
.app-subtitle {
  font-size: 0.8rem; letter-spacing: 0.25em;
  color: rgba(232,208,163,0.5); margin-bottom: 32px;
}
.intro-text {
  font-size: 0.9rem; line-height: 2.0;
  color: var(--cream-dim); margin-bottom: 36px;
  max-width: 380px;
}
.name-input-wrap { width: 100%; max-width: 320px; margin-bottom: 24px; }
.name-input-label {
  display: block; font-size: 0.78rem; letter-spacing: 0.1em;
  color: var(--gold); opacity: 0.75; margin-bottom: 10px;
}
.name-input {
  width: 100%;
  background: rgba(45,27,78,0.5);
  border: 1px solid var(--gold-dim);
  border-radius: 10px;
  padding: 14px 18px;
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 1rem;
  outline: none;
  text-align: center;
  transition: border-color 0.2s;
}
.name-input:focus { border-color: var(--gold); }
.name-input::placeholder { color: rgba(240,234,222,0.3); }
.btn-start {
  background: linear-gradient(135deg, #c9a84c, #e8d5a3);
  border: none; border-radius: 12px;
  padding: 16px 40px;
  color: #1a1520;
  font-family: var(--font-body);
  font-size: 1rem; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(201,168,76,0.35);
  transition: all 0.25s; letter-spacing: 0.05em;
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,0.5); }

/* ── CTA画面 ── */
#cta-screen {
  flex: 1; padding: 32px 24px 40px;
  display: flex; flex-direction: column; align-items: center;
}
.cta-image-wrap { width: 100%; margin-bottom: 24px; border-radius: 8px; overflow: hidden; }
.cta-title {
  font-family: var(--font-title);
  font-size: 1.4rem; color: var(--gold-lt);
  text-align: center; margin-bottom: 8px;
}
.cta-subtitle { font-size: 0.8rem; color: var(--gold); opacity: 0.7; letter-spacing: 0.15em; margin-bottom: 28px; text-align: center; }
.cta-body {
  font-size: 0.9rem; line-height: 2.1;
  color: var(--cream-dim); margin-bottom: 32px; width: 100%;
}
.cta-body em { font-style: normal; color: var(--gold-lt); }
.cta-divider {
  width: 50px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 24px auto; opacity: 0.45;
}
.btn-cta-main {
  display: block; width: 100%;
  background: linear-gradient(135deg, #c9a84c, #e8d5a3);
  border: none; border-radius: 12px;
  padding: 18px 20px;
  color: #1a1520;
  font-family: var(--font-body);
  font-size: 1rem; font-weight: 600;
  text-align: center; text-decoration: none;
  cursor: pointer; margin-bottom: 12px;
  box-shadow: 0 4px 24px rgba(201,168,76,0.3);
  transition: all 0.25s; letter-spacing: 0.03em;
}
.btn-cta-main:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,0.48); }
.btn-cta-sub {
  display: block; width: 100%;
  background: transparent;
  border: 1px solid rgba(240,234,222,0.25);
  border-radius: 12px;
  padding: 15px 20px;
  color: var(--cream-dim);
  font-family: var(--font-body);
  font-size: 0.9rem;
  text-align: center; text-decoration: none;
  cursor: pointer; margin-bottom: 24px;
  transition: all 0.25s;
}
.btn-cta-sub:hover { border-color: var(--gold-dim); color: var(--gold-lt); }
.btn-top {
  background: none; border: none;
  color: rgba(240,234,222,0.3);
  font-family: var(--font-body); font-size: 0.78rem;
  cursor: pointer; letter-spacing: 0.12em;
  transition: color 0.2s;
}
.btn-top:hover { color: rgba(240,234,222,0.7); }

/* ── 途中保存バッジ ── */
#save-badge {
  position: fixed; top: 12px; right: 12px; z-index: 10;
  background: rgba(45,27,78,0.85);
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.72rem; color: var(--gold);
  letter-spacing: 0.08em; opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
#save-badge.show { opacity: 1; }

/* ── フェード ── */
.fade-in { animation: fadeSlide 0.55s ease both; }

@media (max-width: 400px) {
  html { font-size: 16px; }
  .app-title { font-size: 1.7rem; }
}

/* ── 章タイトル画面 ── */
.chapter-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 28px;
  animation: fadeSlide 0.8s ease both;
}
.chapter-icon { font-size: 56px; margin-bottom: 20px; animation: glow 3s ease-in-out infinite alternate; }
.chapter-num {
  font-size: 0.75rem; letter-spacing: 0.3em;
  color: var(--gold); opacity: 0.65; margin-bottom: 14px;
}
.chapter-title {
  font-family: var(--font-title);
  font-size: clamp(1.4rem, 5vw, 1.8rem);
  color: var(--gold-lt);
  line-height: 1.5; margin-bottom: 24px;
}
.chapter-line {
  width: 50px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 20px; opacity: 0.5;
}
.chapter-auto-text {
  font-size: 0.75rem; color: rgba(201,168,76,0.4);
  letter-spacing: 0.1em;
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="save-badge">保存済み ✦</div>

<div id="app">
  <!-- 名前入力画面 -->
  <div id="name-screen" style="display:none;">
    <div class="title-ornament">✦ ✦ ✦</div>
    <div class="title-lantern">🏮</div>
    <h1 class="app-title">大丈夫の奥へ</h1>
    <p class="app-subtitle">— 本音を見つける静かな旅 —</p>
    <p class="intro-text">
      これは、「大丈夫」の奥にある<br>本音を見つける物語体験です。<br><br>
      物語の中で、あなたの名前を<br>呼びながら進んでいきます。<br><br>
      途中で選択肢が出てきたら、<br>今のあなたがいちばん近いと<br>感じるものを選んでください。<br><br>
      所要時間は、だいたい5〜7分ほどです。
    </p>
    <div class="name-input-wrap">
      <label class="name-input-label">呼ばれたい名前を入れてください</label>
      <input type="text" id="name-input" class="name-input" placeholder="なまえ" maxlength="20">
    </div>
    <button class="btn-start" onclick="startStory()">物語をはじめる</button>
  </div>

  <!-- ストーリー画面（初期は非表示） -->
  <div id="story-screen" style="display:none; flex-direction:column; flex:1;">
    <div id="scene-img-area"></div>
    <div id="story-area"></div>
    <div id="choices-area"></div>
    <div id="nav-bar">
      <button class="btn-back" id="btn-back" onclick="goBack()">◁ 戻る</button>
      <button class="btn-next" id="btn-next" onclick="goNext()">次へ</button>
    </div>
  </div>

  <!-- CTA画面（初期は非表示） -->
  <div id="cta-screen" style="display:none;"></div>
</div>

<script>
// ==============================
// CONFIG
// ==============================
const CONFIG = {
  adventureUrl: 'https://example.com/14days',
  lineUrl: 'https://lin.ee/XXXXXXX',
  imgBase: './', // 画像フォルダのパス
};
let forestBgCount = 0; // 森背景の交互カウンター
function forestBg(){ forestBgCount++; return forestBgCount%2===1?'02a_forest_path.png':'02b_forest_path.png'; }

// ==============================
// ステート
// ==============================
let userName = '';
let history = []; // { stepIndex, bubbleIndex, answers }のスタック
let stepIndex = 0;
let bubbleIndex = 0;
let answers = {};  // { q1:'A', q2:'B', ... }
let inChoiceMode = false;

// ==============================
// 星を生成
// ==============================
(function(){
  const sf = document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()>0.85?3:Math.random()>0.5?2:1.5;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${sz}px;height:${sz}px;
      --d:${2+Math.random()*5}s;--delay:${Math.random()*6}s;`;
    sf.appendChild(s);
  }
})();

// ==============================
// ストーリーデータ
// ==============================
// type: 'narration'|'narration-keyword'|'miia'|'name'|'animal'|'choice'
// speaker: 'narration'|'miia'|'name'|'rabbit'|'sheep'|'bird'|'kitsune'
// nextLabel: 次へボタン文言（省略時「次へ」）
// image: 表示画像ファイル名（省略時なし）
// choiceId: この選択肢のID（結果集計用）
// choices: [{label,text,goto}]

const STEPS = [
  // ─── 第1章タイトル ───
  {
    type: 'chapter',
    chapterNum: '第一章',
    chapterTitle: '霧の森とうさぎのモヤ',
    icon: '🌫️',
  },
  // ─────────────────────────────
  // 場面2：霧の森
  // ─────────────────────────────
  {
    image: '01_title_intro.png',
    nextLabel: 'ランタンを灯す',
    bubbles: [
      { type:'narration', text:'あなたは今、霧のかかった森の入口に立っています。' },
      { type:'narration', text:'手の中にあるのは、小さなランタンひとつだけ。' },
      { type:'name',      text:'ここ……どこ？' },
      { type:'narration', text:'地図はありません。\n道しるべも見えません。' },
      { type:'narration', text:'けれど、なぜかこの先へ進まなければいけない気がしました。' },
      { type:'name',      text:'進まなきゃ……いけない気がする。' },
    ]
  },
  // 場面3：胸の中の声
  {
    image: 'forest',
    nextLabel: '森の奥へ進む',
    bubbles: [
      { type:'narration', text:'ランタンの灯りが、ふわりと揺れました。' },
      { type:'narration', text:'すると、胸の奥から小さな声が聞こえてきます。' },
      { type:'name',      text:'不安……。\nなんかこわい……。\n私には無理かもしれない……。' },
      { type:'narration', text:'その声は、ずっとあなたの中にあったものかもしれません。' },
      { type:'name',      text:'でも、このまま抱え続けるのは、もう苦しい。' },
    ]
  },
  // 場面4：黒いモヤ
  {
    nextLabel: '立ち止まる',
    bubbles: [
      { type:'narration', text:'少し進むと、霧の奥から黒いモヤが現れました。' },
      { type:'narration', text:'モヤは、ゆらゆらと形を変えながら、あなたの前に立ちはだかります。' },
      { type:'name',      text:'なに……これ……？' },
      { type:'narration', text:'近づこうとすると、モヤはどんどん黒く、大きくなっていきました。' },
      { type:'name',      text:'どうしよう。\nどうすればいいの……？' },
    ]
  },
  // 場面5：ミーア登場
  {
    nextLabel: 'ミーアを見る',
    bubbles: [
      { type:'miia',     text:'ことばをかければいいのよ。' },
      { type:'name',     text:'え……？\nだれ？' },
      { type:'narration',text:'霧の奥から、小さな足音が近づいてきます。' },
      { type:'narration',text:'そこに現れたのは、まるくて小さな、不思議な魔法使いでした。' },
      { type:'miia',     text:'私はミーア。\n{{name}}の仲間よ。' },
      { type:'name',     text:'仲間……？' },
      { type:'miia',     text:'そう。\n心配しないで。' },
      { type:'miia',     text:'このモヤは、力で倒すものじゃないの。' },
      { type:'miia',     text:'必要なことばをかけて、\n中に閉じ込められている子を解放してあげるのよ。' },
      { type:'name',     text:'中に……誰かいるの？' },
      { type:'miia',     text:'いるわ。\nだから、助けにいきましょう。' },
    ]
  },
  // 場面6：色を選ぶ（質問1）
  {
    nextLabel: '色を選ぶ',
    bubbles: [
      { type:'narration',text:'ミーアは、小さな色の光を3つ取り出しました。' },
      { type:'miia',     text:'{{name}}。\nこの中から、今いちばん気になる色を選んで。' },
      { type:'name',     text:'色……？' },
      { type:'miia',     text:'今のあなたに必要なことばは、\nその色が教えてくれるわ。' },
      { type:'miia',     text:'考えすぎなくていい。\n直感で選んで。' },
    ],
    choiceId: 'q1',
    choices: [

// id→indexマップ
const ID_MAP = {};
STEPS.forEach((s,i)=>{ if(s.id) ID_MAP[s.id]=i; });

// 分岐後の合流先を解決
function resolveNextIndex(step, currentIndex){
  if(step.nextStep && ID_MAP[step.nextStep] !== undefined){
    return ID_MAP[step.nextStep];
  }
  return currentIndex + 1;
}

// ==============================
// localStorage 保存・復元
// ==============================
function saveState(){
  try {
    localStorage.setItem('honne_save', JSON.stringify({
      userName, stepIndex, bubbleIndex, answers, history
    }));
    showSaveBadge();
  } catch(e){}
}
function loadState(){
  try {
    const d = JSON.parse(localStorage.getItem('honne_save')||'null');
    if(d && d.userName){
      userName=d.userName; stepIndex=d.stepIndex;
      bubbleIndex=d.bubbleIndex; answers=d.answers||{}; history=d.history||[];
      return true;
    }
  } catch(e){}
  return false;
}
function clearSave(){
  try { localStorage.removeItem('honne_save'); } catch(e){}
}

let saveBadgeTimer;
function showSaveBadge(){
  const b = document.getElementById('save-badge');
  b.classList.add('show');
  clearTimeout(saveBadgeTimer);
  saveBadgeTimer = setTimeout(()=>b.classList.remove('show'), 2000);
}

// ==============================
// 名前置換
// ==============================
function n(text){ return text.replace(/\{\{name\}\}/g, userName); }

// ==============================
// 画像HTML生成
// ==============================
function imgHtml(filename, alt){
  const resolved = filename === 'forest' ? forestBg() : filename;
  const src = CONFIG.imgBase + resolved;
  return `<img class="scene-image" src="${src}" alt="${alt||''}"
    onerror="this.style.display='none'">`;
}

function avatarHtml(char){
  const src = CONFIG.imgBase + char.img;
  return `<div class="avatar">
    <img src="${src}" alt="${char.name}" onerror="this.outerHTML='<span>${char.icon}</span>'">
  </div>`;
}

// ==============================
// レンダリング
// ==============================
function renderStep(){
  const step = STEPS[stepIndex];

  // ── chapter型：章タイトル画面を2秒後に自動進行 ──
  if(step.type === 'chapter'){
    const storyArea = document.getElementById('story-area');
    const sceneImgArea = document.getElementById('scene-img-area');
    const choicesArea = document.getElementById('choices-area');
    const navBar = document.getElementById('nav-bar');
    sceneImgArea.innerHTML = '';
    choicesArea.innerHTML = '';
    navBar.style.display = 'none';
    storyArea.innerHTML = `
      <div class="chapter-screen">
        <div class="chapter-icon">${step.icon}</div>
        <p class="chapter-num">${step.chapterNum}</p>
        <h2 class="chapter-title">${step.chapterTitle}</h2>
        <div class="chapter-line"></div>
        <p class="chapter-auto-text">まもなく始まります…</p>
      </div>`;
    window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(()=>{
      navBar.style.display = '';
      stepIndex++;
      bubbleIndex = 0;
      saveState();
      renderStep();
    }, 2200);
    return;
  }

  const storyArea = document.getElementById('story-area');
  const sceneImgArea = document.getElementById('scene-img-area');
  const choicesArea = document.getElementById('choices-area');
  const btnNext = document.getElementById('btn-next');
  const btnBack = document.getElementById('btn-back');
  document.getElementById('nav-bar').style.display = '';

  // 画像
  sceneImgArea.innerHTML = step.image ? imgHtml(step.image) : '';

  // ナビ初期状態：ボタン非表示でスタート
  btnNext.style.display = 'none';
  choicesArea.innerHTML = '';
  storyArea.innerHTML = '';
  btnBack.disabled = (history.length === 0);

  // 吹き出しを時間差で自動表示
  const bubbles = step.bubbles;
  let shown = 0;

  function showNextBubble(){
    if(shown >= bubbles.length){
      // 全部表示し終わったら選択肢 or 次へボタンを出す
      if(step.choices){
        inChoiceMode = true;
        btnNext.style.display = 'none';
        step.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn fade-in';
          btn.innerHTML = `<span class="choice-tag">${c.label}</span>${n(c.text)}`;
          btn.onclick = () => selectChoice(c, step.choiceId);
          choicesArea.appendChild(btn);
        });
      } else {
        inChoiceMode = false;
        btnNext.style.display = '';
        if(step.isCta){
          btnNext.textContent = '次の扉をみてみる';
        } else if(step.nextLabel){
          btnNext.textContent = step.nextLabel;
        } else {
          btnNext.textContent = '次へ';
        }
      }
      // 保存
      bubbleIndex = bubbles.length - 1;
      saveState();
      return;
    }
    const el = makeBubble(bubbles[shown]);
    storyArea.appendChild(el);
    shown++;
    // 最後の要素へスクロール
    setTimeout(()=>{
      el.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }, 80);
    // 次の吹き出しまでの待ち時間（ナレーションは少し長め）
    const b = bubbles[shown - 1];
    const isCta = step.isCta || false;
    const delay = isCta
      ? (b.type === 'narration' || b.type === 'narration-keyword') ? 2200 : 1800
      : (b.type === 'narration' || b.type === 'narration-keyword') ? 1100 : 900;
    setTimeout(showNextBubble, delay);
  }

  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(showNextBubble, 200);
}

function makeBubble(b){
  const wrap = document.createElement('div');
  wrap.className = 'fade-in';

  if(b.type === 'narration'){
    const div = document.createElement('div');
    div.className = 'narration';
    div.textContent = n(b.text);
    wrap.appendChild(div);
    return wrap;
  }
  if(b.type === 'narration-keyword'){
    const div = document.createElement('div');
    div.className = 'narration keyword';
    div.textContent = n(b.text);
    wrap.appendChild(div);
    return wrap;
  }
  if(b.type === 'name'){
    const row = document.createElement('div');
    row.className = 'bubble-row bubble-right';
    row.innerHTML = `
      <div class="bubble">
        <span class="speaker-name">${userName}</span>
        ${n(b.text).replace(/\n/g,'<br>')}
      </div>
      <div class="avatar" style="background:rgba(240,234,222,0.1);border-color:rgba(240,234,222,0.2);">
        <span>👤</span>
      </div>`;
    wrap.appendChild(row);
    return wrap;
  }
  if(b.type === 'miia'){
    const char = CHARS.miia;
    const row = document.createElement('div');
    row.className = 'bubble-row bubble-left';
    row.innerHTML = `
      ${avatarHtml(char)}
      <div class="bubble">
        <span class="speaker-name">${char.name}</span>
        ${n(b.text).replace(/\n/g,'<br>')}
      </div>`;
    wrap.appendChild(row);
    return wrap;
  }
  if(b.type === 'animal'){
    const char = CHARS[b.speaker] || { icon:'🐾', name:'なかま', img:'' };
    const row = document.createElement('div');
    row.className = 'bubble-row bubble-left bubble-animal';
    row.innerHTML = `
      <div class="avatar" style="width:36px;height:36px;font-size:18px;background:rgba(45,27,78,0.6);">
        ${char.img ? `<img src="${CONFIG.imgBase+char.img}" alt="${char.name}" onerror="this.outerHTML='<span>${char.icon}</span>'">` : `<span>${char.icon}</span>`}
      </div>
      <div class="bubble" style="font-size:0.85rem;padding:10px 14px;background:linear-gradient(135deg,rgba(45,27,78,0.6),rgba(20,12,38,0.8));">
        <span class="speaker-name">${char.name}</span>
        ${n(b.text).replace(/\n/g,'<br>')}
      </div>`;
    wrap.appendChild(row);
    return wrap;
  }
  return wrap;
}

// ==============================
// ナビゲーション
// ==============================
function goNext(){
  const step = STEPS[stepIndex];
  if(step.isCta){
    showCta(); return;
  }
  history.push({ stepIndex, bubbleIndex: 0, answers: {...answers} });
  stepIndex = resolveNextIndex(step, stepIndex);
  bubbleIndex = 0;
  saveState();
  renderStep();
}

function selectChoice(choice, choiceId){
  history.push({ stepIndex, bubbleIndex, answers: {...answers} });
  if(choiceId) answers[choiceId] = choice.label;
  const target = ID_MAP[choice.goto];
  if(target !== undefined){
    stepIndex = target;
  } else {
    stepIndex++;
  }
  bubbleIndex = 0;
  saveState();
  renderStep();
}

function goBack(){
  if(history.length === 0) return;
  const prev = history.pop();
  stepIndex   = prev.stepIndex;
  bubbleIndex = prev.bubbleIndex;
  answers     = prev.answers;
  saveState();
  renderStep();
}

    <div class="cta-divider"></div>

    <a href="14days.html" class="btn-cta-main" target="_blank" rel="noopener">
      🗝️ 次の扉をみてみる
    </a>
    <button class="btn-cta-sub" onclick="restartStory()">トップに戻る</button>
  `;
  clearSave();
}

// ==============================
// スタート・リスタート
// ==============================
function startStory(){
  const input = document.getElementById('name-input').value.trim();
  userName = input || 'あなた';
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('story-screen').style.display = 'flex';
  stepIndex = 0; bubbleIndex = 0; answers = {}; history = [];
  saveState();
  renderStep();
}

function restartStory(){
  clearSave();
  location.reload();
}

// ==============================
// 起動：途中保存チェック → 名前入力表示
// ==============================
(function initApp(){
  if(loadState()){
    // 保存データあり
    const resume = confirm(`「${userName}」として途中まで進んでいます。\n続きから始めますか？`);
    if(resume){
      document.getElementById('story-screen').style.display = 'flex';
      renderStep();
      return;
    } else {
      clearSave();
    }
  }
  // 名前入力を表示
  document.getElementById('name-screen').style.display = 'flex';
})();

// Enterキーで開始
document.getElementById('name-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') startStory();
});
</script>
</body>
</html>
